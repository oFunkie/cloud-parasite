<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Master</title>
<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: whitesmoke;
    padding: 20px;
  }
  h1 { text-align: center; }
  .grid {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .card {
    background: #1c1c1c;
    border: 2px solid #333;
    border-radius: 10px;
    padding: 15px;
    width: 34vw;
    text-align: center;
  }
  .card.online { border-color: #4caf50; }
  .card.offline { border-color: #555; opacity: 0.5; }
  .card h2 { margin-top: 0; }
  .media-box {
    width: 33vw;
    height: 33vw;
    margin: 10px auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  .media-box img,
  .media-box video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .media-box iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: white;
  }
  .media-box pre {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 10px;
    box-sizing: border-box;
    overflow-y: auto;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
    background: #0a0a0a;
    color: #7fd;
  }
  .download-link {
    display: inline-block;
    padding: 10px 20px;
    background: #333;
    color: whitesmoke;
    text-decoration: none;
    border-radius: 6px;
    border: 1px solid #555;
  }
  .download-link:hover { background: #444; }
  .timestamp { font-size: 12px; color: #888; }
  .placeholder {
    color: #666;
    font-style: italic;
  }
</style>
</head>
<body>

<h1>Master - Client Cloud</h1>
<div class="grid" id="grid"></div>

<script>
  const POLL_INTERVAL_MS = 2500;
  const gridEl = document.getElementById("grid");

  function base64UrlDecode(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    return atob(str);
  }

  function decodeJwtPayload(token) {
    const payloadRaw = token.split('.')[1];
    return JSON.parse(base64UrlDecode(payloadRaw));
  }

  // Décode une chaîne base64 en texte UTF-8 propre (gère les accents correctement,
  // contrairement à un simple atob() qui traite chaque octet comme un caractère latin1)
  function base64ToText(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function reconstructFile(chunksObj) {
    const payloads = Object.values(chunksObj).map(decodeJwtPayload);
    payloads.sort((a, b) => a.chunk_index - b.chunk_index);

    if (payloads.length < payloads[0].total_chunks) {
      return null; // chunk manquant : fichier corrompu, on ne tente rien
    }

    const fullBase64 = payloads.map(p => p.data).join('');
    return {
      base64: fullBase64,
      mimeType: payloads[0].mime_type || "application/octet-stream",
      filename: payloads[0].filename || "fichier",
      ext: payloads[0].ext || "",
    };
  }

  // Choisit le bon rendu HTML selon le type de fichier
  function renderMedia(file) {
    const { base64: b64, mimeType, filename, ext } = file;
    const dataUrl = `data:${mimeType};base64,${b64}`;

    if (mimeType.startsWith("image/")) {
      return `<img src="${dataUrl}" alt="${filename}" />`;
    }

    if (mimeType.startsWith("video/")) {
      return `<video src="${dataUrl}" controls></video>`;
    }

    if (mimeType === "application/pdf" || ext === ".pdf") {
      return `<iframe src="${dataUrl}" title="${filename}"></iframe>`;
    }

    if (mimeType.startsWith("text/") || ext === ".txt") {
      const text = base64ToText(b64);
      return `<pre>${text.replace(/</g, "&lt;")}</pre>`;
    }

    // Cas générique : binaire non affichable (ex: .gpg, un fichier chiffré
    // n'a par nature aucun contenu à "afficher" côté navigateur).
    return `
      <div>
        <p class="placeholder">Fichier non affichable (${ext || mimeType})</p>
        <a class="download-link" href="${dataUrl}" download="${filename}">
          Télécharger ${filename}
        </a>
      </div>
    `;
  }

  async function refresh() {
    let data;
    try {
      const resp = await fetch("/api/master/status");
      data = await resp.json();
    } catch (e) {
      gridEl.innerHTML = `<p>Erreur de connexion au serveur : ${e.message}</p>`;
      return;
    }

    gridEl.innerHTML = "";

    for (const [clientId, info] of Object.entries(data.clients)) {
      const card = document.createElement("div");
      card.className = `card ${info.authenticated ? "online" : "offline"}`;

      if (info.authenticated) {
        const file = reconstructFile(info.chunks);
        const mediaHtml = file
          ? renderMedia(file)
          : `<p class="placeholder">Fichier incomplet</p>`;

        card.innerHTML = `
          <h2>Client ${clientId} (connected)</h2>
          <div class="timestamp">Connected since : ${new Date(info.connected_at).toLocaleTimeString()}</div>
          <div class="media-box">${mediaHtml}</div>
        `;
      } else {
        card.innerHTML = `
          <h2>Client ${clientId} (disconnected)</h2>
          <div class="media-box"><p class="placeholder">En attente de connexion...</p></div>
        `;
      }

      gridEl.appendChild(card);
    }
  }

  refresh();
  setInterval(refresh, POLL_INTERVAL_MS);
</script>

</body>
</html>
