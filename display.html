<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Image</title>
<style>
  body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  img { image-rendering: pixelated; }
</style>
</head>
<body>

<img id="jwt-image" alt="" />

<script>
  function base64UrlDecode(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    return atob(str);
  }

  function decodeJwtPayload(token) {
    const payloadRaw = token.split('.')[1];
    return JSON.parse(base64UrlDecode(payloadRaw));
  }

  function getAllCookies() {
    const cookies = {};
    document.cookie.split(';').forEach(c => {
      const [key, val] = c.trim().split('=');
      if (key) cookies[key] = val;
    });
    return cookies;
  }

  const cookies = getAllCookies();
  const chunkPayloads = [];

  for (const key in cookies) {
    if (key.startsWith("session_token_")) {
      chunkPayloads.push(decodeJwtPayload(cookies[key]));
    }
  }

  chunkPayloads.sort((a, b) => a.chunk_index - b.chunk_index);

  // Détermine le nombre total de chunks attendu (depuis n'importe quel payload reçu)
  const totalChunks = chunkPayloads[0]?.total_chunks || chunkPayloads.length;

  // Reconstruit un tableau de la bonne taille, en comblant les chunks manquants par une chaîne vide
  const dataByIndex = new Array(totalChunks).fill('');
  chunkPayloads.forEach(p => {
    dataByIndex[p.chunk_index] = p.data;
  });

  const missingIndexes = [];
  for (let i = 0; i < totalChunks; i++) {
    if (!dataByIndex[i]) missingIndexes.push(i);
  }
  if (missingIndexes.length > 0) {
    console.warn(`Chunks manquants (remplacés par du vide) : ${missingIndexes.join(', ')}`);
  }

  const fullBase64 = dataByIndex.join('');
  const mimeType = chunkPayloads[0]?.mime_type || "image/jpeg";

  const imgEl = document.getElementById("jwt-image");
  imgEl.src = `data:${mimeType};base64,` + fullBase64;
  imgEl.onload = function() {
    imgEl.style.width = (imgEl.naturalWidth * 10) + "px";
  };
</script>

</body>
</html>
