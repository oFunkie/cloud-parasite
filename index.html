<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Debug JWT</title>
<style>
  body { font-family: monospace; padding: 20px; background: #111; color: whitesmoke; }
  h2 { color: whitesmoke; }
  pre { background: #222; padding: 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  img { border: 2px solid whitesmoke; margin-top: 10px; }
</style>
</head>
<body>

<h2>Raw cookies (document.cookie)</h2>
<pre id="raw-cookie"></pre>

<h2>JWT Chunks</h2>
<pre id="jwt-token"></pre>

<h2>Decoded payloads (JSON)</h2>
<pre id="jwt-payload"></pre>

<h2>Image reconstructed from JWTs</h2>
<img id="jwt-image" alt="error, no image" />

<script>
  function base64UrlDecode(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    return atob(str);
  }

  function decodeJwtPayload(token) {
    const payloadRaw = token.split('.')[1];
    return JSON.parse(base64UrlDecode(payloadRaw));
  }

  function getAllCookies() {
    const cookies = {};
    document.cookie.split(';').forEach(c => {
      const [key, val] = c.trim().split('=');
      if (key) cookies[key] = val;
    });
    return cookies;
  }

  document.getElementById("raw-cookie").textContent = document.cookie || "(aucun cookie lisible en JS - vérifie httponly)";

  const cookies = getAllCookies();
  const chunkTokens = [];

  for (const key in cookies) {
    if (key.startsWith("session_token_")) {
      chunkTokens.push({ key, token: cookies[key] });
    }
  }

  if (chunkTokens.length === 0) {
    document.getElementById("jwt-token").textContent = "(aucun cookie 'session_token_X' trouvé)";
    document.getElementById("jwt-payload").textContent = "(rien à décoder)";
  } else {
    document.getElementById("jwt-token").textContent = chunkTokens.map(c => `${c.key} = ${c.token}`).join("\n\n");

    const chunkPayloads = chunkTokens.map(c => decodeJwtPayload(c.token));
    chunkPayloads.sort((a, b) => a.chunk_index - b.chunk_index);

    document.getElementById("jwt-payload").textContent = JSON.stringify(chunkPayloads, null, 2);

    const fullBase64 = chunkPayloads.map(p => p.data).join('');
    const mimeType = chunkPayloads[0].mime_type || "image/jpeg"; 
    const imgEl = document.getElementById("jwt-image");
    imgEl.src = `data:${mimeType};base64,` + fullBase64;
    imgEl.onload = function() {
      imgEl.style.width = 50 + "vw";
      imgEl.style.imageRendering = "pixelated";
      imgEl.style.height = "auto";
    };
  }
</script>

</body>
</html>
